name: Continuous Deployment (CD)

on:
  push:
    branches: [ "main", "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Build & Package Deployment Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Deployment Bundle
        run: |
          mkdir -p build_output
          cp -r src requirements.txt README.md build_output/
          tar -czvf weather-checker-app.tar.gz -C build_output .

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-checker-deployment-bundle
          path: weather-checker-app.tar.gz
          retention-days: 5

      - name: Simulated Deployment Status
        run: |
          echo "✅ Continuous Deployment: Release package built and verified successfully!"

      - name: Send Notification Alert
        if: always()
        run: |
          echo "### 🔔 CD Notification Alert" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "::notice title=CD Notification Alert::✅ SUCCESS: Package artifact generated and deployed successfully!"
            echo "✅ **ALERT SUCCESS**: CD release bundle created successfully for commit ${{ github.sha }}." >> $GITHUB_STEP_SUMMARY
          else
            echo "::error title=CD Notification Alert::❌ FAILURE: CD Deployment workflow failed!"
            echo "❌ **ALERT FAILURE**: CD process encountered errors." >> $GITHUB_STEP_SUMMARY
          fi
