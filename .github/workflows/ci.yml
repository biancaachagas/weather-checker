name: Continuous Integration (CI)

on:
  push:
    branches: [ "main", "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with pytest
        run: |
          PYTHONPATH=. pytest

      - name: Send Notification Alert
        if: always()
        run: |
          echo "### 🔔 Status Notification Alert" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "::notice title=Workflow Notification Alert::✅ SUCCESS: All 6 unit tests and code quality checks passed on branch ${{ github.ref_name }}!"
            echo "✅ **ALERT SUCCESS**: Continuous Integration workflow completed successfully for commit ${{ github.sha }}." >> $GITHUB_STEP_SUMMARY
          else
            echo "::error title=Workflow Notification Alert::❌ FAILURE: Continuous Integration workflow failed!"
            echo "❌ **ALERT FAILURE**: One or more steps failed during execution." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send External Alert to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"content\": \"🔔 **ALERTA DE CI/CD**: O workflow executou com status **${{ job.status }}** no repositório **${{ github.repository }}**! (Branch: \`${{ github.ref_name }}\` | Commit: \`${{ github.sha }}\`)\"}" \
                 $DISCORD_WEBHOOK
          else
            echo "DISCORD_WEBHOOK secret ainda não configurado."
          fi
